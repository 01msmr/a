<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <!-- viewport-fit=cover: sonst endet die Seite über dem Home-Indikator
         und die untere Leiste kann den Platz dort nicht nutzen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark" />
    <title>a.msmr.co</title>
    <base target="_blank" />

    <!-- Farbschema hell/dunkel: vor dem ersten Paint setzen; ohne gespeicherte Wahl folgt es dem System (Automatik) -->
    <script>
        (() => {
            const KEY = 'msmr.theme', MODES = ['light', 'dark'];
            const dunkel = matchMedia('(prefers-color-scheme: dark)');
            const read = () => { try { const v = localStorage.getItem(KEY); return MODES.includes(v) ? v : null; } catch { return null; } };
            const apply = () => {
                const v = read(), el = document.documentElement;
                el.dataset.theme = v || (dunkel.matches ? 'dark' : 'light');   // auto folgt dem System; CSS kennt nur light und dark
                document.dispatchEvent(new Event('msmrtheme'));
            };
            window.msmrTheme = {
                get: () => read() || (dunkel.matches ? 'dark' : 'light'),
                auto: () => !read(),
                set(m) { try { localStorage.setItem(KEY, m); } catch { } apply(); },
                setAuto() { try { localStorage.removeItem(KEY); } catch { } apply(); },
            };
            apply();
            addEventListener('storage', e => e.key === KEY && apply());
            dunkel.addEventListener('change', apply);
        })();
    </script>

    <!-- Zoom s/m: vor dem ersten Paint setzen; Wahl pro Gerät in localStorage, sonst s -->
    <script>
        (() => {
            const KEY = 'msmr.zoom', LEVELS = ['s', 'm'];
            const read = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); return o && o.v === 1 && o.level === 'm' ? 'm' : 's'; } catch { return 's'; } };
            const apply = () => {
                document.documentElement.dataset.zoom = read();
                document.dispatchEvent(new Event('msmrzoom'));
            };
            window.msmrZoom = {
                get: () => document.documentElement.dataset.zoom,
                set(l) { if (!LEVELS.includes(l)) return; try { localStorage.setItem(KEY, JSON.stringify({ v: 1, level: l })); } catch { } apply(); },
            };
            apply();
            addEventListener('storage', e => e.key === KEY && apply());
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />

    <!-- Icons aus der Schrift der Seite (Ubuntu) gerendert, opak (die alten Graustufen-PNGs mit Alpha zeigte iOS nur klein oder gar nicht), hell und dunkel;
         neue Dateinamen, weil iOS Icons je URL zwischenspeichert. Das Home-Symbol von iOS nimmt das helle (apple-touch-icon) -->
    <link rel="icon" href="./favicon/ico-light-180.png" sizes="180x180" type="image/png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./favicon/ico-dark-180.png" sizes="180x180" type="image/png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="./favicon/ico-light-180.png">
    <link rel="manifest" href="./favicon/manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="styles.css?v=2026-10-17an">

</head>

<body>
    <div class="app-frame">
        <header class="title">
            <a href="#sec1" class="home-link" target="_self">
                a.<span class="titledomain">msmr.co</span>
            </a>
            <nav id="section-nav-list">
                <button type="button" id="settings-btn" class="nav-btn"
                aria-label="Einstellungen" title="Einstellungen">
                <i class="fa-solid fa-gear secicon" aria-hidden="true"></i><span class="secshort">set</span>
            </button>
                <!-- Sections-Liste: Zahnrad und Dropdown teilen sich mit den Chips eine Flex-Zeile (gleiche Regeln, gleiche Breiten) -->
                <button type="button" id="section-jumper" class="nav-btn" aria-haspopup="true" aria-expanded="false"
                aria-controls="jumper-pop" aria-label="Sections" title="Sections">
                <i class="fa-solid fa-chevron-down secicon" aria-hidden="true"></i><span class="secshort">sec</span>
            </button>
            </nav>
            <!-- nur in der Smartphone-/Kleinansicht sichtbar, siehe styles.css -->
            <a href="#" id="step-prev" class="stepper" target="_self" aria-label="vorige Section">
                <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
            </a>
            <a href="#" id="step-next" class="stepper" target="_self" aria-label="nächste Section">
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </a>
        </header>
        <article id="container" class="container"></article>
        <!-- ein Knopf pro Einstellung, schaltet reihum; Inhalt baut app.js -->
        <!-- Sections-Liste im Icon-Modus: das native Menü kann keine Icons zeigen -->
        <div id="jumper-pop" class="jumper-pop" popover="manual"></div>
        <div id="settings-pop" class="settings-pop" popover="manual"></div>
    </div>

    <script src="app.js?v=2026-10-17an"></script>
</body>

</html>
