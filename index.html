<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover: otherwise the page ends above the home indicator
         and the bottom bar cannot use the space there -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark" />
    <title>a.msmr.co</title>
    <meta name="description" content="Personal start page: links in sections, shown as tiles.">
    <base target="_blank" />

    <!-- Color scheme light/dark: set before the first paint; without a saved choice it follows the system (automatic) -->
    <script>
        (() => {
            const KEY = 'msmr.theme', MODES = ['light', 'dark'];
            const darkQuery = matchMedia('(prefers-color-scheme: dark)');
            const read = () => { try { const v = localStorage.getItem(KEY); return MODES.includes(v) ? v : null; } catch { return null; } };
            const apply = () => {
                const v = read(), el = document.documentElement;
                el.dataset.theme = v || (darkQuery.matches ? 'dark' : 'light');   // auto follows the system; CSS only knows light and dark
                document.dispatchEvent(new Event('msmrtheme'));
            };
            window.msmrTheme = {
                get: () => read() || (darkQuery.matches ? 'dark' : 'light'),
                auto: () => !read(),
                set(m) { try { localStorage.setItem(KEY, m); } catch { } apply(); },
                setAuto() { try { localStorage.removeItem(KEY); } catch { } apply(); },
            };
            apply();
            addEventListener('storage', e => e.key === KEY && apply());
            darkQuery.addEventListener('change', apply);
        })();
    </script>

    <!-- Zoom s/m: set before the first paint; choice per device in localStorage, otherwise s -->
    <script>
        (() => {
            const KEY = 'msmr.zoom', LEVELS = ['s', 'm'];
            const read = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); return o && o.v === 1 && o.level === 'm' ? 'm' : 's'; } catch { return 's'; } };
            const apply = () => {
                document.documentElement.dataset.zoom = read();
                document.dispatchEvent(new Event('msmrzoom'));
            };
            window.msmrZoom = {
                get: () => document.documentElement.dataset.zoom,
                set(l) { if (!LEVELS.includes(l)) return; try { localStorage.setItem(KEY, JSON.stringify({ v: 1, level: l })); } catch { } apply(); },
            };
            apply();
            addEventListener('storage', e => e.key === KEY && apply());
        })();
    </script>

    <!-- Bar position top/bottom: set before the first paint; without a stored value the CSS decides per layout (js/prefs.js keeps it) -->
    <script>
        try { const p = localStorage.getItem('a.navPos'); if (p === 'top' || p === 'bottom') document.documentElement.classList.add('nav-' + p); } catch { }
    </script>

    <!-- Start the data requests now, while the scripts load; js/boot.js takes these promises -->
    <script>
        window.msmrLinks = fetch('links.php?t=' + Date.now());
        window.msmrNeverDead = fetch('never-dead.json');
    </script>

    <link rel="preload" href="fonts/ubuntu-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="vendor/fontawesome-6.7.2/webfonts/fa-solid-900-subset.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="vendor/fontawesome-6.7.2/css/all.min.css?v=2026-10-22g">

    <!-- Icons (README "Home screen icon"): a light and a dark file. The tab favicon follows the color scheme through media; iOS ignores media on
         apple-touch-icon, so favicon/touch-icon-inline.js sets it from script, as a data: URI (the Add to Home Screen sheet of iOS 27.2 fails to load a
         network URL). The apple-touch-icon link below is the fallback without JavaScript; switch with "node tools/touch-icon.js inline|url" -->
    <link rel="icon" href="./favicon/ico-light-180.png?v=2026-10-22g" sizes="180x180" type="image/png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./favicon/ico-dark-180.png?v=2026-10-22g" sizes="180x180" type="image/png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="./favicon/ico-light-180.png">
    <script src="favicon/touch-icon-inline.js?v=2026-10-22g"></script>
    <link rel="manifest" href="./favicon/manifest.json">
    <!-- ?app: the standalone web app variant (manifest-app.json and the iOS web app tags), see favicon/app-mode.js and the README -->
    <script src="favicon/app-mode.js?v=2026-10-22g"></script>
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="styles.css?v=2026-10-22g">
    <!-- deferred: download starts in the head, they run in this order after the page is parsed -->
    <script src="js/state.js?v=2026-10-22g" defer></script>
    <script src="js/prefs.js?v=2026-10-22g" defer></script>
    <script src="js/hint.js?v=2026-10-22g" defer></script>
    <script src="js/render.js?v=2026-10-22g" defer></script>
    <script src="js/active-section.js?v=2026-10-22g" defer></script>
    <script src="js/touch.js?v=2026-10-22g" defer></script>
    <script src="js/glow.js?v=2026-10-22g" defer></script>
    <script src="js/ghost-header.js?v=2026-10-22g" defer></script>
    <script src="js/light.js?v=2026-10-22g" defer></script>
    <script src="js/cursor.js?v=2026-10-22g" defer></script>
    <script src="js/grid.js?v=2026-10-22g" defer></script>
    <script src="js/navigation.js?v=2026-10-22g" defer></script>
    <script src="js/strip.js?v=2026-10-22g" defer></script>
    <script src="js/links.js?v=2026-10-22g" defer></script>
    <script src="js/settings.js?v=2026-10-22g" defer></script>
    <script src="js/boot.js?v=2026-10-22g" defer></script>
    <script src="js/edit.js?v=2026-10-22g" defer></script>

</head>

<body>
    <div class="app-frame">
        <header class="title">
            <a href="#sec1" class="home-link" target="_self">
                a.<span class="titledomain">msmr.co</span>
            </a>
            <nav id="section-nav-list">
                <button type="button" id="settings-btn" class="nav-btn"
                aria-label="Settings" data-hint="Settings">
                <i class="fa-solid fa-gear secicon" aria-hidden="true"></i><span class="secshort">set</span>
            </button>
                <!-- Sections list: gear and dropdown share a flex row with the chips (same rules, same widths) -->
                <button type="button" id="section-jumper" class="nav-btn" aria-haspopup="true" aria-expanded="false"
                aria-controls="jumper-pop" aria-label="Sections" data-hint="Sections">
                <i class="fa-solid fa-chevron-down secicon" aria-hidden="true"></i><span class="secshort">sec</span>
            </button>
            </nav>
        </header>
        <article id="container" class="container"></article>
        <!-- one button per setting, cycles through the values; js/settings.js builds the content -->
        <!-- Sections list in icon mode: the native menu cannot show icons -->
        <div id="jumper-pop" class="jumper-pop" popover="manual"></div>
        <div id="settings-pop" class="settings-pop" popover="manual"></div>
    </div>

</body>

</html>
