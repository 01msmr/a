<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <!-- viewport-fit=cover: sonst endet die Seite über dem Home-Indikator
         und die untere Leiste kann den Platz dort nicht nutzen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark" />
    <title>a.msmr.co</title>
    <base target="_blank" />

    <!-- Farbschema auto/hell/dunkel: vor dem ersten Paint setzen; Wahl pro Gerät, ohne Wahl gilt die Systemvorgabe -->
    <script>
        (() => {
            const KEY = 'msmr.theme', MODES = ['light', 'dark'];
            const read = () => { try { const v = localStorage.getItem(KEY); return MODES.includes(v) ? v : null; } catch { return null; } };
            const apply = () => {
                const v = read(), el = document.documentElement;
                if (v) el.dataset.theme = v; else delete el.dataset.theme;
                document.dispatchEvent(new Event('msmrtheme'));
            };
            window.msmrTheme = {
                get: () => read() || 'auto',
                set(m) {
                    try { if (MODES.includes(m)) localStorage.setItem(KEY, m); else localStorage.removeItem(KEY); } catch { }
                    apply();
                },
            };
            apply();
            addEventListener('storage', e => e.key === KEY && apply());
        })();
    </script>

    <!-- Zoom s/m/l: vor dem ersten Paint setzen; Wahl pro Gerät in localStorage, sonst automatisch -->
    <script>
        (() => {
            const KEY = 'msmr.zoom', LEVELS = ['s', 'm', 'l'];
            const auto = () => {
                const w = innerWidth, mq = q => matchMedia(q).matches;
                if (/SmartTV|Tizen|Web0S|webOS|NetCast|AFTM|AFTS|Android TV|BRAVIA|HbbTV|CrKey/i.test(navigator.userAgent)) return 'l';
                if (w >= 1800 && !mq('(hover:hover) and (pointer:fine)')) return 'l';
                if (mq('(pointer:coarse)') && w >= 900) return 'm';
                return 's';
            };
            const read = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); return o && o.v === 1 && LEVELS.includes(o.level) ? o : null; } catch { return null; } };
            const apply = () => {
                const o = read(), el = document.documentElement;
                el.dataset.zoom = o ? o.level : auto();
                el.dataset.zoomMode = o ? 'user' : 'auto';
                document.dispatchEvent(new Event('msmrzoom'));
            };
            window.msmrZoom = {
                get: () => document.documentElement.dataset.zoom,
                mode: () => document.documentElement.dataset.zoomMode,
                set(l) { if (!LEVELS.includes(l)) return; try { localStorage.setItem(KEY, JSON.stringify({ v: 1, level: l })); } catch { } apply(); },
                cycle() { this.set(LEVELS[(LEVELS.indexOf(this.get()) + 1) % 3]); },
                step(d) { this.set(LEVELS[Math.max(0, Math.min(2, LEVELS.indexOf(this.get()) + d))]); },
                reset() { try { localStorage.removeItem(KEY); } catch { } apply(); },
            };
            apply();
            addEventListener('storage', e => e.key === KEY && apply());
            addEventListener('resize', () => { if (!read()) apply(); });
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />

    <!-- dasselbe Bild wie das iOS-Home-Icon; favicon-32x32.png gab es nicht -->
    <link rel="icon" href="./favicon/apple-icon-180x180.png" sizes="180x180" type="image/png">
    <link rel="apple-touch-icon" href="./favicon/apple-icon-180x180.png">
    <link rel="manifest" href="./favicon/manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="styles.css">

    <script type="text/javascript">
        document.addEventListener("touchstart", function () { }, true);
    </script>
</head>

<body>
    <div class="seite">
        <h3 class="title">
            <a href="#sec1" class="home-link" target="_self">
                a.<span class="titledomain">msmr.co</span>
            </a>
            <nav id="section-nav-list">
                <button type="button" id="settings-btn" class="settings-btn"
                aria-label="Einstellungen" title="Einstellungen">
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
            </button>
            </nav>
            <!-- autocomplete=off: sonst stellt Chrome beim Reload die alte
                 Auswahl wieder her und löst damit erneut den Edit-Mode aus -->
            <select id="section-jumper" autocomplete="off"></select>
            <!-- nur am Telefon sichtbar, siehe styles.css -->
            <a href="#" id="step-prev" class="stepper" target="_self" aria-label="vorige Section">
                <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
            </a>
            <a href="#" id="step-next" class="stepper" target="_self" aria-label="nächste Section">
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </a>
        </h3>
        <article id="container" class="container"></article>
        <!-- ein Knopf pro Einstellung, schaltet reihum; Inhalt baut app.js -->
        <div id="settings-pop" class="settings-pop" popover="manual"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
